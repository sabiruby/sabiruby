[package]
name = "sabiruby-cli"
version = "0.6.1"
edition = "2024"
rust-version = "1.85"
description = "The `sabiruby` command: run Ruby source and mruby 4.1 bytecode on the SabiRuby VM, with the switches of the reference mruby, and compile like mrbc"
license = "MIT"
keywords = ["mruby", "ruby", "cli", "bytecode", "vm"]
categories = ["command-line-utilities", "compilers"]
repository = "https://github.com/sabiruby/sabiruby"
readme = "README.md"
include = ["/src/**/*", "/README.md"]

[features]
# Strings as characters, as in a reference built with MRB_UTF8_STRING. On by default;
# `--no-default-features` builds the byte-string mode the reference ships by default.
default = ["utf8", "regexp"]
utf8 = ["sabiruby/utf8"]
# mruby-regexp. On by default; `--no-default-features --features utf8` builds the command
# against a VM that has no `Regexp` (the VM's own feature of the same name).
regexp = ["sabiruby/regexp"]

[[bin]]
name = "sabiruby"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sabiruby = { version = "0.6.0", path = "..", default-features = false, features = ["std"] }
sabiruby-compiler = { version = "0.3.0", path = "../compiler", features = ["host"] }
