[package]
name = "sabiruby-compiler"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "The reference mruby 4.1.0-rc compiler (mruby-compiler with its Prism parser, built as C) as a Rust library: Ruby source to RITE bytecode byte-identical to mrbc, and a Prism-based syntax-highlight map for editors"
license = "MIT"
keywords = ["mruby", "ruby", "compiler", "bytecode", "prism"]
# `compilers` is what it is; `external-ffi-bindings` is how it is built — the crate is a Rust
# surface over mruby's and Prism's own C, not a port (see README, "What is vendored").
categories = ["compilers", "external-ffi-bindings"]
repository = "https://github.com/sabiruby/sabiruby"
readme = "README.md"
links = "sabiruby_mrc"
# The golden tests read the reference mrbc output of the parent repository; they stay in git.
include = ["/src/**/*", "/csrc/**/*", "/vendor/**/*", "/build.rs", "/README.md"]

[features]
# `Compiler`: the `sabiruby::Host` the VM asks to compile an `eval` string (and to read a
# file for `require`). Off by default so the crate stays usable without the VM.
host = ["dep:sabiruby"]
# `ast()`: Prism's pretty-printed syntax tree (the format of the debug `mrbc --verbose`).
# Off by default, so the default build is the reference mrbc's configuration.
ast = []

[dependencies]
sabiruby = { version = "0.6.0", path = "..", optional = true, default-features = false }

[build-dependencies]
cc = "1"
