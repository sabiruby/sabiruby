name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi, wasm32-unknown-unknown
      # the VM, the CLI, and the compiler's golden tests against the reference mrbc output
      - run: cargo test --workspace
      # the VM and the command without `checkpoint`: sabiruby-cli turns it on by default, so the
      # workspace run above always builds the VM with it. The VM with its own defaults (std, utf8,
      # regexp), and the command without the feature, whose `--resume` code is behind a cfg.
      - run: cargo test -p sabiruby
      - run: cargo test -p sabiruby-cli --no-default-features --features "utf8 regexp"
      # the VM with mruby-regexp left out (`docs/design/gems.md`, "Gems as Cargo features"):
      # the whole library, its tests and the mrbtest floor `baseline-noregexp.txt`. The full
      # `tools/mrbtest.sh --no-regexp` needs Docker for the reference `mrbc`, so CI runs the
      # compiled-in floor instead, which is the same assertions.
      - run: cargo test -p sabiruby --no-default-features --features "std utf8"
      # no_std for a target that has none, with and without the pattern engine
      - run: tools/check_no_std.sh --features regexp
      - run: tools/check_no_std.sh --features utf8
      # the VM library, pure Rust (the C compiler is only in sabiruby-compiler / sabiruby-cli)
      - run: cargo build -p sabiruby --lib --target wasm32-unknown-unknown
      # what docs.rs and crates.io will get. The libraries and the command are documented in two
      # runs, into two directories: the CLI's binary is named `sabiruby` like the library, so one
      # run has both writing `target/doc/sabiruby/` and they race (cargo#6313 — it was a warning
      # until it lost the race and became "No such file or directory")
      - run: cargo doc --no-deps --workspace --lib
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps -p sabiruby-cli --bins
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_TARGET_DIR: target/doc-cli
      - run: cargo publish --dry-run --workspace
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85   # rust-version in Cargo.toml
      - run: cargo check --workspace --all-targets
