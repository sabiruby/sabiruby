[package]
name = "sabiruby"
version = "0.5.1"
edition = "2024"
# edition 2024 and core::ptr::fn_addr_eq need 1.85
rust-version = "1.85"
description = "SabiRuby: a VM for mruby 4.1 bytecode written in Rust (\"rusted Ruby\"), checked against mruby 4.1.0-rc"
license = "MIT"
keywords = ["mruby", "ruby", "bytecode", "vm", "embedded"]
categories = ["compilers", "embedded", "game-development", "no-std"]
repository = "https://github.com/sabiruby/sabiruby"
readme = "README.md"
# What crates.io gets: the library, the CLI, the design notes and the licences. The test
# suite (fixtures, mruby's test/t copies and their .mrb), benchmarks and tools stay in git.
include = ["/src/**/*", "/build.rs", "/docs/**/*.md", "/README.md", "/CHANGELOG.md", "/LICENSE", "/LICENSE-mruby"]

[workspace]
# sabiruby (this package): the VM library, pure Rust, no_std
# compiler/: sabiruby-compiler, the reference mruby compiler built as C
# cli/: sabiruby-cli, the `sabiruby` command (depends on both)
# macros/: sabiruby-macros, the derive and attribute macros (depends on neither)
# serde/: sabiruby-serde, serde and JSON on top of the VM (the VM itself never depends on serde)
members = ["compiler", "cli", "macros", "serde"]

[lib]
name = "sabiruby"
path = "src/lib.rs"

# docs.rs builds with every feature on, so the `macros` re-exports and the regexp classes show up
[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "utf8", "regexp"]
# The library itself is no_std + alloc. `std` only adds `std::error::Error` glue
# and is used by the command line tool (crate sabiruby-cli) and the tests.
std = []
# `utf8`: Strings are sequences of characters, as the reference built with
# MRB_UTF8_STRING is (`length`, `[]`, `index`, `chars`, `reverse`, `center`, `upcase`, …).
# Without it they are sequences of bytes, which is the reference's default build. Both are
# checked against their own reference image (`docs/design/utf8.md`).
utf8 = ["regex-automata?/unicode"]
# `regexp`: mruby-regexp — the `Regexp` and `MatchData` classes, the String and Symbol
# methods whose pattern form the gem answers, and the engine under them. Off, the crate
# does not depend on `regex-automata` at all and the constant `Regexp` does not exist,
# which is the reference built without the gem (`docs/design/gems.md`, "Gems as features").
regexp = ["dep:regex-automata"]
# `macros`: re-exports `#[derive(RubyClass)]` and `#[ruby_methods]` from `sabiruby-macros` at
# this crate's root, so that a host writes one dependency and one `use` (the pattern serde and
# serde_derive have). Off by default: the macros are a proc macro, which is a compiler plugin
# built for the host, and the VM itself must stay buildable without one (`docs/design/macros.md`).
# The macros can still be depended on directly; what they generate names `::sabiruby::…` either
# way, so the generated code is the same through the re-export and through `sabiruby-macros`.
macros = ["dep:sabiruby-macros"]

[dependencies]
# Only with the feature `macros`. A proc-macro crate is compiled for the host and runs at
# compile time, so it is not part of the `no_std` library that is built for the target.
sabiruby-macros = { version = "0.1.0", path = "macros", optional = true }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more"] }
libm = { version = "0.2", default-features = false }
# mruby-regexp's engine (`docs/plans/gems-plan.md` 3.6): the pattern matcher is Rust's rather than a
# port of the reference's NFA, and it builds without `std`.
regex-automata = { version = "0.4", optional = true, default-features = false, features = ["alloc", "syntax", "meta", "nfa-pikevm", "nfa-backtrack"] }

[dev-dependencies]
# The tests install the compiler as the VM's host, so that the `eval` cases and mruby's
# `mruby-eval` tests run (the library itself never depends on it).
sabiruby-compiler = { path = "compiler", features = ["host"] }

[profile.release]
# One code generation unit, not the default 16. With 16 the compiler cuts the crate into 16
# units and which function lands in which changes when a single line does, so the inlining and
# the placement of `exec_frames` move with every edit: a change that only touched `String#<<`
# measured `bm_so_mandelbrot` +16% twice in a row, and -2.5% at `codegen-units = 1`
# (`docs/design/optimizations.md` 4, `docs/worklog/2026-09-16-perf3.md` 0). From this commit on
# this is what ships and what every benchmark is taken with, so that a measurement answers what
# the change did rather than how the crate happened to be split this time.
codegen-units = 1
